<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mazzi Lab</title><link rel="stylesheet" href="/style.css"></head><body>
<header><b>◈ Mazzi Lab</b><span>● STATIC ANALYSIS · NO EXECUTION</span></header>
<main><section id="landing"><div class="hero">◈</div><h1>Inspect. Understand. Analyze.</h1><p>Upload ZIP, RAR, 7Z or common archives for static inspection.</p><label class="choose">Choose Archive<input id="pick" type="file" accept=".zip,.rar,.7z,.tar,.gz,.bz2,.xz" hidden></label><div id="drop">or drag an archive here</div><div id="status"></div><div id="progress"><i></i><span>0%</span></div></section>
<section id="work" hidden><aside><div class="side">FILES <b id="count">0</b></div><input id="search" placeholder="Search files…"><div id="list"></div></aside><article><nav><span id="crumb">No file selected</span><button id="new">New archive</button><button id="report">Export report</button></nav><div id="stats"></div><div class="tabs"><button class="active" data-t="info">Overview</button><button data-t="code">Code</button><button data-t="hex">Hex</button><button data-t="strings">Strings</button></div><div id="info" class="pane active"></div><pre id="code" class="pane"></pre><pre id="hex" class="pane"></pre><pre id="strings" class="pane"></pre></article></section></main>
<script>
const $=s=>document.querySelector(s);let sid=null,files=[],current=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const size=n=>n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(1)+" MB";
function status(x,bad=false){$("#status").textContent=x;$("#status").className=bad?"bad":""}
function responseJSON(xhr){let t=xhr.responseText||"";if(!t.trim())throw Error("Server returned an empty response (HTTP "+xhr.status+").");let j;try{j=JSON.parse(t)}catch{throw Error("Server returned invalid JSON (HTTP "+xhr.status+").")}if(xhr.status<200||xhr.status>=300||j.ok===false)throw Error(j.error||"Server error");return j}
function upload(f){if(!f)return;status("Uploading "+f.name+"…");$("#progress").style.display="flex";let x=new XMLHttpRequest(),fd=new FormData();fd.append("file",f);x.open("POST","/api/upload");x.timeout=600000;x.upload.onprogress=e=>{let p=e.lengthComputable?Math.round(e.loaded/e.total*100):0;$("#progress i").style.width=p+"%";$("#progress span").textContent=p+"%"};x.onload=()=>{try{let j=responseJSON(x);sid=j.session;files=j.files;$("#landing").hidden=true;$("#work").hidden=false;$("#count").textContent=files.length;draw();$("#stats").innerHTML=`<b>ARCHIVE</b> ${esc(j.name)}　 <b>FILES</b> ${files.length}　 <b class=good>READY</b>`;$("#info").textContent="Select a file to inspect it."}catch(e){status("Upload failed: "+e.message,true)}};x.onerror=()=>status("Network error while uploading.",true);x.ontimeout=()=>status("Upload timed out.",true);x.send(fd)}
function draw(){let q=$("#search").value.toLowerCase();$("#list").innerHTML="";files.filter(f=>f.name.toLowerCase().includes(q)).forEach(f=>{let d=document.createElement("div");d.className="file";d.dataset.id=f.id;d.textContent=(f.text?"◈ ":"▸ ")+f.name;d.onclick=()=>select(f.id);$("#list").appendChild(d)})}
async function select(id){current=files.find(f=>f.id===id);document.querySelectorAll(".file").forEach(x=>x.classList.toggle("active",+x.dataset.id===id));$("#crumb").textContent=current.name;let r=await fetch(`/api/file/${sid}/${id}`);if(!r.ok){status("Could not read file.",true);return}let j;try{j=await r.json()}catch{status("Server returned invalid JSON.",true);return}let b=Uint8Array.from(atob(j.data),c=>c.charCodeAt(0));$("#info").innerHTML=`<div class=cards><div><small>FILE</small><b>${esc(j.name)}</b></div><div><small>SIZE</small><b>${size(j.size)}</b></div><div><small>SHA-256</small><b>${j.sha256}</b></div><div><small>ENTROPY</small><b>${j.entropy}</b></div><div><small>INDICATORS</small><b class=${j.hits.length?"warn":"good"}>${j.hits.length?esc(j.hits.join(", ")):"None detected"}</b></div></div>`;$("#code").textContent=new TextDecoder().decode(b)||"[empty file]";$("#hex").textContent=makeHex(b);$("#strings").textContent=makeStrings(b)||"No printable strings found.";current.detail=j}
function makeHex(b){let s="";for(let i=0;i<Math.min(b.length,8192);i+=16){let h="",a="";for(let j=0;j<16;j++){if(i+j<b.length){let x=b[i+j];h+=x.toString(16).padStart(2,"0")+" ";a+=x>=32&&x<127?String.fromCharCode(x):"."}else{h+="   ";a+=" "}}s+=i.toString(16).padStart(8,"0")+"  "+h+" |"+a+"|\\n"}return s}
function makeStrings(b){let o=[],s="";for(let x of b){if(x>=32&&x<=126)s+=String.fromCharCode(x);else{if(s.length>=4)o.push(s);s=""}}if(s.length>=4)o.push(s);return[...new Set(o)].slice(0,2000).join("\\n")}
$("#pick").onchange=e=>upload(e.target.files[0]);$("#drop").ondragover=e=>e.preventDefault();$("#drop").ondrop=e=>{e.preventDefault();upload(e.dataTransfer.files[0])};$("#search").oninput=draw;
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".pane").forEach(x=>x.classList.remove("active"));$("#"+b.dataset.t).classList.add("active")});
$("#new").onclick=()=>location.reload();$("#report").onclick=()=>{if(!current?.detail)return alert("Select a file first.");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(current.detail,null,2)],{type:"application/json"}));a.download="mazzi-lab-report.json";a.click()};
</script></body></html>
